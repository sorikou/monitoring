name: Monitor

on:
  schedule:
    # Avoid the start-of-hour GitHub Actions scheduling peak.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send one deterministic Gmail test notification
        required: true
        default: false
        type: boolean
      run_full_monitoring:
        description: Run all enabled jobs with Gmail notifications enabled
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monitoring-state-write
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  REGISTRY_ENDPOINT: https://docs.google.com/spreadsheets/d/1vAWAh3O06_n74x5J-FubE8tIHVKeZeRlGF5p49yCYUM/edit?usp=sharing

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check required secret
        shell: bash
        env:
          STATE_REPO_SSH_KEY: ${{ secrets.STATE_REPO_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_REPO_SSH_KEY" || {
            echo "STATE_REPO_SSH_KEY is required" >&2
            exit 1
          }

      - name: Reject conflicting manual modes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email && inputs.run_full_monitoring }}
        shell: bash
        run: |
          echo "send_email and run_full_monitoring cannot both be true" >&2
          exit 1

      - name: Check Gmail secrets
        if: ${{ github.event_name == 'schedule' || inputs.send_email || inputs.run_full_monitoring }}
        shell: bash
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          set -euo pipefail
          test -n "$MAIL_USER" || {
            echo "MAIL_USER is required for Gmail monitoring" >&2
            exit 1
          }
          test -n "$MAIL_PASS" || {
            echo "MAIL_PASS is required for Gmail monitoring" >&2
            exit 1
          }

      - name: Check out monitoring code
        uses: actions/checkout@v6

      - name: Check out private state repository
        uses: actions/checkout@v6
        with:
          repository: sorikou/monitoring-state
          ssh-key: ${{ secrets.STATE_REPO_SSH_KEY }}
          path: state-repository
          fetch-depth: 1

      - name: Require existing SQLite state
        shell: bash
        run: |
          set -euo pipefail
          test -s state-repository/db.sqlite || {
            echo "Private state repository does not contain db.sqlite" >&2
            exit 1
          }
          cp state-repository/db.sqlite state/db.sqlite

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and validate public registry
        run: python scripts/registry/fetch_registry.py

      - name: Generate and verify enabled urlwatch jobs
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        run: python scripts/monitoring/generate_urls.py

      - name: Run one monitoring pass with email disabled
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == false && inputs.run_full_monitoring == false }}
        run: python scripts/monitoring/run_local.py --verbose --timeout 600

      - name: Run full monitoring with Gmail enabled
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_monitoring) }}
        env:
          SCHEDULED_MONITORING_CONFIRMATION: RUN_ENABLED_WITH_GMAIL
          URLWATCH_EMAIL_USER: ${{ secrets.MAIL_USER }}
          URLWATCH_EMAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: >-
          python scripts/monitoring/run_scheduled.py
          --verbose
          --timeout 600

      - name: Prepare exactly one deterministic Gmail test job
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email && inputs.run_full_monitoring == false }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitoring/generate_urls.py \
            --expected-count 1 \
            --include-id monitor-0001 \
            --output generated/email-test.yaml
          python scripts/monitoring/prepare_email_test.py \
            --input generated/email-test.yaml \
            --output generated/email-test.yaml

      - name: Run exactly one confirmed Gmail test job
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email && inputs.run_full_monitoring == false }}
        env:
          EMAIL_TEST_CONFIRMATION: SEND_ONE_GMAIL_TEST
          URLWATCH_EMAIL_USER: ${{ secrets.MAIL_USER }}
          URLWATCH_EMAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: >-
          python scripts/monitoring/run_email_test.py
          --urls generated/email-test.yaml
          --verbose
          --timeout 600

      - name: Save SQLite state to private repository
        shell: bash
        working-directory: state-repository
        run: |
          set -euo pipefail
          test -s ../state/db.sqlite || {
            echo "Monitoring did not produce state/db.sqlite" >&2
            exit 1
          }
          test ! -e ../state/db.sqlite-wal || {
            echo "SQLite WAL file still exists; refusing to save incomplete state" >&2
            exit 1
          }
          cp ../state/db.sqlite db.sqlite

          if git diff --quiet -- db.sqlite; then
            echo "SQLite state is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.sqlite
          git commit -m "Update monitoring state"
          git push origin HEAD:main
